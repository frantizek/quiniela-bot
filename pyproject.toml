[project]
name = "quiniela-bot"
version = "0.1.0"
description = "A Telegram bot for recreational team-assignment quinielas."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "python-telegram-bot==22.8",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]